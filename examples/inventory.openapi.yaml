openapi: 3.0.3
info:
  title: Inventory API
  version: 1.0.0
servers:
  - url: https://inventory.example.com
paths:
  /items:
    get:
      operationId: Inventory.listItems
      x-operation-name: listItems
      responses:
        '200':
          description: Items in the inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      operationId: Inventory.createItem
      x-operation-name: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /items/{id}:
    get:
      operationId: Inventory.getItem
      x-operation-name: getItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  schemas:
    NewItem:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        price:
          type: number
          nullable: true
    Item:
      allOf:
        - $ref: '#/components/schemas/NewItem'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
